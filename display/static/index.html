<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAL 9000</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        .hal-container {
            position: relative;
            width: 400px;
            height: 400px;
        }

        /* The eye housing - metallic bezel */
        .eye-housing {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 50%, #0a0a0a 100%);
            box-shadow:
                inset 0 2px 10px rgba(255, 255, 255, 0.1),
                inset 0 -2px 10px rgba(0, 0, 0, 0.5),
                0 0 50px rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Inner bezel ring */
        .eye-bezel {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
            box-shadow:
                inset 0 4px 20px rgba(0, 0, 0, 0.8),
                inset 0 -2px 10px rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The lens area */
        .eye-lens {
            position: relative;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #1a0000 0%, #0a0000 100%);
            overflow: hidden;
        }

        /* The glowing eye */
        .eye-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%,
                #ff6b6b 0%,
                #ff4444 20%,
                #cc0000 50%,
                #990000 70%,
                #660000 100%
            );
            box-shadow:
                0 0 20px #ff0000,
                0 0 40px #ff0000,
                0 0 60px #cc0000,
                0 0 80px #990000;
            transition: all 0.05s ease-out;
        }

        /* Highlight reflection */
        .eye-highlight {
            position: absolute;
            top: 25%;
            left: 30%;
            width: 20px;
            height: 15px;
            background: radial-gradient(ellipse at center,
                rgba(255, 255, 255, 0.8) 0%,
                rgba(255, 255, 255, 0) 70%
            );
            border-radius: 50%;
            transform: rotate(-30deg);
        }

        /* Center dot */
        .eye-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #ff8888 0%, #cc0000 100%);
        }

        /* State indicator */
        .state-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #444;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Listening animation - pulsing */
        .eye-glow.listening {
            animation: listening-pulse 1.5s ease-in-out infinite;
        }

        @keyframes listening-pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                box-shadow:
                    0 0 20px #ff0000,
                    0 0 40px #ff0000,
                    0 0 60px #cc0000,
                    0 0 80px #990000;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.05);
                box-shadow:
                    0 0 30px #ff0000,
                    0 0 60px #ff0000,
                    0 0 90px #cc0000,
                    0 0 120px #990000;
            }
        }

        /* Processing animation - rotating glow */
        .eye-glow.processing {
            animation: processing-rotate 2s linear infinite;
        }

        @keyframes processing-rotate {
            0% {
                box-shadow:
                    10px 0 30px #ff0000,
                    0 0 40px #ff0000,
                    0 0 60px #cc0000;
            }
            25% {
                box-shadow:
                    0 10px 30px #ff0000,
                    0 0 40px #ff0000,
                    0 0 60px #cc0000;
            }
            50% {
                box-shadow:
                    -10px 0 30px #ff0000,
                    0 0 40px #ff0000,
                    0 0 60px #cc0000;
            }
            75% {
                box-shadow:
                    0 -10px 30px #ff0000,
                    0 0 40px #ff0000,
                    0 0 60px #cc0000;
            }
            100% {
                box-shadow:
                    10px 0 30px #ff0000,
                    0 0 40px #ff0000,
                    0 0 60px #cc0000;
            }
        }

        /* Idle state - subtle breathing */
        .eye-glow.idle {
            animation: idle-breathe 4s ease-in-out infinite;
        }

        @keyframes idle-breathe {
            0%, 100% {
                opacity: 0.85;
                transform: translate(-50%, -50%) scale(0.98);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Connection status */
        .connection-status {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #333;
        }

        .connection-status.connected {
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }
    </style>
</head>
<body>
    <div class="hal-container">
        <div class="eye-housing">
            <div class="eye-bezel">
                <div class="eye-lens">
                    <div class="eye-glow idle" id="eye-glow">
                        <div class="eye-highlight"></div>
                        <div class="eye-center"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="state-indicator" id="state-indicator">IDLE</div>
    </div>
    <div class="connection-status" id="connection-status"></div>

    <script src="/static/eye.js"></script>
</body>
</html>
